# ALICE CODING — brain stack (self-contained).
# ALICE api+web (fork riêng) + embedding bge-m3 (bundled, local).
#
# MỖI PROJECT MỘT BRAIN. Tên compose project (`-p <BRAIN_ID>`) do launcher suy ra từ đường dẫn
# tuyệt đối của kho tri thức, nên hai project khác nhau không bao giờ đụng container hay port.
# Volume ở đây là NAMED volume → Docker tự thêm tiền tố `<BRAIN_ID>_`, dữ liệu cách ly sẵn,
# không cần đặt tên tay và không có đường nào để hai brain nhìn thấy dữ liệu của nhau.
#
# KHÔNG đặt `name:` ở file này: đặt là ghim cứng một project name cho mọi cài đặt, đúng thứ
# vừa gỡ bỏ. Tên đến từ `-p` của launcher.
#
# File này chỉ PULL IMAGE dựng sẵn — người dùng không cần git, không cần source, không phải
# build gì. Muốn build từ source trên máy (chỉ dành cho người phát triển chính alice-brain /
# alice-core) thì chồng thêm `compose.dev.yaml`; launcher tự làm việc đó khi thấy
# ALICE_APP_PATH được đặt trong .env của brain.
#
# Chạy 1 lệnh: npm run brain
# Chạy compose thủ công thì phải tự đặt BRAIN_ID, BRAIN_LOGS (tuyệt đối), SAG_SECRET_KEY rồi:
#   docker compose -p "$BRAIN_ID" --env-file <state>/.env up -d

services:
  # ── Embedding bge-m3 (local, bundled; OpenAI-compatible qua Ollama) ──
  embedding:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    init: true
    logging:
      driver: json-file
      options:
        max-size: ${ALICE_DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${ALICE_DOCKER_LOG_MAX_FILES:-3}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # ── ALICE backend ──
  api:
    # Image dựng sẵn, kéo về là chạy. Engine ALICE CORE đã nằm sẵn trong image này.
    image: ${ALICE_IMAGE_API:-ghcr.io/blueberry-sensei/alice-brain-api:latest}
    pull_policy: ${ALICE_PULL_POLICY:-missing}
    environment:
      SAG_ENVIRONMENT: dev
      SAG_DEBUG: "false"
      SAG_SECRET_KEY: ${SAG_SECRET_KEY:?thieu SAG_SECRET_KEY - chay `npm run brain` de launcher tu sinh}
      # URL chính mang danh tính project. Giữ localhost cũ như alias tương thích để bookmark
      # cũ không bị CORS chặn sau khi nâng cấp.
      SAG_CORS_ORIGINS: http://${BRAIN_HOST:-localhost}:${WEB_PORT:-3000},http://localhost:${WEB_PORT:-3000}
      SAG_ALLOW_REGISTRATION: "false"
      SAG_DATABASE_URL: sqlite+aiosqlite:////data/sag.db
      SAG_DATA_DIR: /data/engine
      SAG_UPLOAD_DIR: /data/uploads
      # Log ghi ra bind-mount để đọc thẳng bằng editor trên host. Xoay vòng 20MB × 5 bản.
      SAG_LOG_DIR: /data/logs
      SAG_SAG_VECTOR_PROVIDER: lancedb
      SAG_SAG_LANGUAGE: ${SAG_SAG_LANGUAGE:-en}   # prompt trích xuất: 'en' | 'vi'
      # Embedding -> container bundled (không cần đụng tới)
      SAG_EMBEDDING_BASE_URL: http://embedding:11434/v1
      SAG_EMBEDDING_MODEL: ${SAG_EMBEDDING_MODEL:-bge-m3}
      SAG_EMBEDDING_API_KEY: "ollama"
      # LLM KHÔNG cấu hình ở đây. Nơi duy nhất là app: Settings → Models.
      # Ở đó thêm được nhiều provider theo thứ tự ưu tiên (429/hết quota thì tự chuyển nhà),
      # key được mã hoá bằng khoá dẫn xuất từ SAG_SECRET_KEY.
      # Hệ quả: đừng đổi SAG_SECRET_KEY sau khi đã nhập key, đổi là phải nhập lại.
    volumes:
      # DB + engine data + upload nằm trong NAMED VOLUME: không file nào của "não" nằm trong
      # cây repo, nên không thể lỡ tay commit hay kéo theo khi copy thư mục project đi nơi khác.
      - sagdata:/data
      # Ngoại lệ có chủ đích: log vẫn bind ra host để đọc bằng editor thường. Log không chứa
      # credential (key đã mã hoá trong DB, API không bao giờ in key ra).
      - ${BRAIN_LOGS}:/data/logs
    init: true
    logging:
      driver: json-file
      options:
        max-size: ${ALICE_DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${ALICE_DOCKER_LOG_MAX_FILES:-3}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      embedding:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/system/ready').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ── ALICE web UI (nơi set credential LLM) ──
  web:
    image: ${ALICE_IMAGE_WEB:-ghcr.io/blueberry-sensei/alice-brain-web:latest}
    pull_policy: ${ALICE_PULL_POLICY:-missing}
    environment:
      # Cổng API đọc lúc CHẠY rồi nhúng vào HTML (app/layout.tsx). KHÔNG nướng vào image:
      # cùng một image web được mọi project dùng, mà mỗi project một cổng — nướng cứng là
      # web của project này gọi sang API của project khác.
      SAG_PUBLIC_API_PORT: ${API_PORT:-8000}
    init: true
    logging:
      driver: json-file
      options:
        max-size: ${ALICE_DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${ALICE_DOCKER_LOG_MAX_FILES:-3}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  # Tên thật là <BRAIN_ID>_sagdata / <BRAIN_ID>_ollama → mỗi project một bộ, không lẫn.
  sagdata:
  ollama:
